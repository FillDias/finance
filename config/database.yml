# PostgreSQL. Versions 9.3 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   gem install pg -- --with-pg-config=/usr/local/bin/pg_config
# On Windows:
#   gem install pg
#       Choose the win32 build.
#       Install PostgreSQL and put its /bin directory on your path.
#
# Configure Using Gemfile
# gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>


# Development and production both point at the real Postgres database
# hosted on Supabase, via DATABASE_URL (set in .env, never committed).
development:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>

# The test database is a local, disposable Postgres instance — never the
# Supabase database. RSpec recreates its schema on every run, so pointing
# this at Supabase would risk wiping real financial data.
test:
  <<: *default
  url: <%= ENV.fetch("TEST_DATABASE_URL", "postgres://finance_test:finance_test_local@localhost:5432/finance_test") %>

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
